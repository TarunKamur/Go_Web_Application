apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-web-app
  namespace: go-web-app
  labels:
    app: go-web-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: go-web-app

  template:
    metadata:
      labels:
        app: go-web-app

    spec:
      containers:
        - name: go-web-app
          image: btarunkumar/go-web-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
